                      className: 'w-full p-2 bg-white border border-stone-200 rounded-lg outline-none'
                    })

                    rows: 2, value: brujula.sabiduria,
                    onChange: (ev) => saveBrujula('sabiduria', ev.target.value),

                    className: 'w-full p-2.5 bg-white border border-stone-200 rounded-lg outline-none focus:ring-2 focus:ring-rose-400'

                      className: 'w-full p-2 bg-stone-800 border border-stone-700 rounded-lg text-white outline-none'

                  ),
                  e('div', null,

                }, 'Obtener el Ebook Complementario →')
              )
            )
          )
        ),

        // VISTA BITÁCORA
        tab === 'log' && e('div', { className: 'p-4 sm:p-6 space-y-6 animate-fade-in' },
          e('div', { className: 'bg-white p-6 rounded-2xl border border-stone-200 shadow-xs space-y-5' },
            e('div', { className: 'flex justify-between items-center border-b border-stone-100 pb-3' },
              e('div', null,
                e('span', { className: 'text-xs font-bold text-rose-600 uppercase tracking-widest' }, 'REGISTRO DE NAVEGACIÓN'),

              ),
              e('button', {
                onClick: exportarBitacora,

            e('div', { className: 'p-3.5 bg-stone-50 border border-stone-200 rounded-xl text-xs text-stone-600 space-y-1' },

            ),

            e('div', { className: 'space-y-3 max-h-80 overflow-y-auto pr-1 text-xs' },
              DAYS_DATA.map(d => {
                const hasA = d.fields.every(f => answers[f.key] && answers[f.key].trim().length > 2);
                return e('div', { key: d.day, className: 'p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-1' },
                  e('div', { className: 'flex justify-between font-bold' },
                    e('span', null, `Día ${d.day}: ${d.title}`),
                    e('span', { className: hasA ? 'text-emerald-600' : 'text-stone-400' }, hasA ? 'Completado' : 'Pendiente')

                  hasA && d.fields.map(f => answers[f.key] ? e('p', { key: f.key, className: 'text-stone-700' },

                  e('span', { className: d21Data.carta ? 'text-emerald-600' : 'text-stone-400' }, d21Data.carta ? 'Completada' : 'Pendiente')

                d21Data.carta ? e('div', { className: 'space-y-1 text-stone-800' },
                  e('p', { className: 'italic whitespace-pre-line' }, d21Data.carta),
                  e('p', { className: 'font-semibold text-rose-700 pt-1' }, `Primer paso: ${d21Data.primerPaso}`)
                ) : e('p', { className: 'text-stone-400 italic' }, 'Aún no has redactado tu carta personal de integración.')
              )
            ),

            e('div', { className: 'pt-2 flex justify-end' },
              e('button', {
                onClick: reiniciarTodo,
                className: 'text-xs text-rose-600 hover:underline'
              }, 'Reiniciar Bitácora')
            )
          )
        ),

        // NAVEGACIÓN INFERIOR FIJA
        e('nav', { className: 'fixed bottom-0 left-0 right-0 max-w-3xl mx-auto bg-white border-t border-stone-200 px-2 py-2 z-40 flex items-center justify-around shadow-lg' },
          [
            { id: 'home', label: 'Inicio' },
            { id: 'days', label: '21 Días' },
            { id: 'diagnostic', label: 'Diagnóstico' },
            { id: 'clarity', label: 'Claridad' },
            { id: 'brujula', label: 'Brújula' },
            { id: 'log', label: 'Bitácora' }
          ].map(item => e('button', {
            key: item.id,
            onClick: () => setTab(item.id),
            className: `py-1 px-2.5 rounded-xl text-[11px] font-semibold transition-all ${
              tab === item.id ? 'text-rose-600 font-bold bg-rose-50' : 'text-stone-400 hover:text-stone-600'
            }`
          }, item.label))
        )

      );
    }

    // Montaje en DOM
    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
